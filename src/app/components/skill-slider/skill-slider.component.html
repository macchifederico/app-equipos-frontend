<div class="skill-slider-container">
  <div class="skill-header">
    <label class="skill-label">
      <i *ngIf="config.icon" [class]="config.icon"></i>
      {{ config.label }}
    </label>
    <div class="skill-value">
      <span class="value-number" [style.color]="getSliderColor()">{{ value }}</span>
      <span class="value-label">{{ skillLabels[value] }}</span>
    </div>
  </div>

  <div class="skill-description" *ngIf="config.description">
    {{ config.description }}
  </div>

  <!-- Star Rating -->
  <div class="star-rating">
    <button 
      type="button"
      *ngFor="let star of [1,2,3,4,5]" 
      class="star-button"
      [class.disabled]="disabled"
      [ngClass]="getStarClass(star)"
      (click)="onStarClick(star)"
      [attr.aria-label]="'Calificar con ' + star + ' estrellas'"
    >
      ⭐
    </button>
  </div>

  <!-- Slider -->
  <div class="slider-container">
    <button 
      type="button" 
      class="slider-btn minus"
      [disabled]="disabled || value <= 1"
      (click)="decrement()"
      aria-label="Disminuir"
    >
      −
    </button>
    
    <input 
      type="range" 
      class="skill-slider"
      [value]="value"
      min="1" 
      max="5" 
      step="1"
      [disabled]="disabled"
      [style.--slider-color]="getSliderColor()"
      (input)="onSliderChange($event)"
      [attr.aria-label]="config.label + ': ' + value + ' de 5'"
    >
    
    <button 
      type="button" 
      class="slider-btn plus"
      [disabled]="disabled || value >= 5"
      (click)="increment()"
      aria-label="Aumentar"
    >
      +
    </button>
  </div>

  <!-- Progress Indicator -->
  <div class="progress-indicator">
    <div class="progress-bar">
      <div 
        class="progress-fill"
        [style.width.%]="(value / 5) * 100"
        [style.background-color]="getSliderColor()"
      ></div>
    </div>
    <div class="progress-labels">
      <span class="label-min">1</span>
      <span class="label-max">5</span>
    </div>
  </div>
</div>
